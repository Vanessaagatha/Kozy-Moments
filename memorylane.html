<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Down Memory Lane — KoMo 📸</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

<!-- FLOATING DECOR -->
<div class="sparkle s1">✨</div>
<div class="sparkle s2">🌸</div>
<div class="sparkle s3">💜</div>
<div class="sparkle s4">☁️</div>

<!-- HEADER -->
<header>
  <a class="logo-section" href="index.html" style="text-decoration:none;">
    <img src="logo.png" alt="KoMo logo">
    <h1>KoMo</h1>
  </a>
  <nav>
    <a class="simple-link" href="index.html">🏠 Home</a>
    <a class="simple-link" href="about.html">💜 About</a>
    <a class="simple-link" href="journal.html">📔 Journal</a>
  </nav>
</header>

<!-- PHOTOBOOTH SECTION -->
<section class="photobooth">
  <div class="photobooth-inner fade-up">
    <h2>Down Memory Lane 📸</h2>

    <!-- CAMERA + CANVAS -->
    <div class="camera-box">
      <div style="text-align:center;">
        <video id="video" autoplay playsinline></video>
        <p class="camera-label">🎥 Live Camera</p>
      </div>
      <div style="text-align:center;">
        <canvas id="canvas"></canvas>
        <p class="camera-label">📸 Snapshot</p>
      </div>
    </div>

    <!-- FILTERS -->
    <div class="filters">
      <button onclick="setFilter('none', this)" class="active-filter">✨ Normal</button>
      <button onclick="setFilter('grayscale(1)', this)">🖤 B&W</button>
      <button onclick="setFilter('sepia(1)', this)">🍂 Vintage</button>
      <button onclick="setFilter('brightness(1.2) saturate(1.5)', this)">☀️ Bright</button>
      <button onclick="setFilter('contrast(1.2) hue-rotate(20deg)', this)">💜 Dreamy</button>
    </div>

    <!-- BUTTONS -->
    <div class="photo-buttons">
      <button onclick="startCamera()">🎥 Start Camera</button>
      <button onclick="takePhoto()">📸 Take Photo</button>
      <button onclick="saveToJournal()">📔 Add To Journal</button>
    </div>

    <!-- GALLERY -->
    <div class="gallery" id="gallery"></div>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <span>Made with 🌸💜☁️ by KoMo</span>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="journal.html">Journal</a>
    <a href="memorylane.html">Memory Lane</a>
    <a href="about.html">About</a>
  </div>
</footer>

<script src="auth.js"></script>
<script src="script.js"></script>
</body>
</html>
